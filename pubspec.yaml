name: mshop
description: "M-Shop Pharmacy - Pharmacy Management System"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # Barcode
  mobile_scanner: ^7.4.0

  # PDF & Printing
  pdf: ^3.13.0
  printing: ^5.15.0

  # Sharing
  share_plus: ^13.3.0
  http: ^1.6.0

  # Force Update
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/mshop_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/mshop_logo.png

